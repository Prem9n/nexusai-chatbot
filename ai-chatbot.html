<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusAI — Intelligent Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --surface2: #1a1a26; --border: #2a2a3d;
    --accent: #7c6aff; --accent2: #ff6a9b; --accent3: #6affda;
    --text: #e8e8f0; --text2: #8888aa;
    --user-bubble: #1e1a3a; --ai-bubble: #121a2a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 60% 40% at 20% 20%, rgba(124,106,255,0.08) 0%, transparent 60%), radial-gradient(ellipse 40% 60% at 80% 80%, rgba(106,255,218,0.06) 0%, transparent 60%); pointer-events: none; z-index: 0; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); position: relative; z-index: 10; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; animation: pulse-glow 3s ease-in-out infinite; }
  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 20px rgba(124,106,255,0.4)} 50%{box-shadow:0 0 35px rgba(124,106,255,0.7)} }
  .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; background: linear-gradient(135deg, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); }
  .status-dot { width: 8px; height: 8px; background: var(--accent3); border-radius: 50%; animation: blink 2s ease-in-out infinite; box-shadow: 0 0 8px var(--accent3); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .clear-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); padding: 6px 14px; border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; transition: all 0.2s; }
  .clear-btn:hover { border-color: var(--accent); color: var(--accent); }
  .chat-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; position: relative; z-index: 1; scroll-behavior: smooth; }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; gap: 20px; min-height: 300px; animation: fadeUp 0.6s ease forwards; }
  .welcome-icon { width: 80px; height: 80px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 36px; animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .welcome h1 { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--text), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .welcome p { color: var(--text2); font-size: 13px; max-width: 320px; line-height: 1.7; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 500px; }
  .suggestion { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: 'DM Mono', monospace; }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
  .message { display: flex; gap: 12px; animation: fadeUp 0.3s ease forwards; max-width: 800px; width: 100%; align-self: flex-start; }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .avatar { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; margin-top: 2px; }
  .avatar.ai { background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 0 15px rgba(124,106,255,0.3); }
  .avatar.user { background: linear-gradient(135deg, var(--accent3), #4a9eff); }
  .bubble { padding: 14px 18px; border-radius: 16px; font-size: 13px; line-height: 1.7; max-width: calc(100% - 50px); }
  .bubble.ai { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .bubble.user { background: var(--user-bubble); border: 1px solid rgba(124,106,255,0.3); border-top-right-radius: 4px; }
  .bubble-label { font-size: 10px; color: var(--text2); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
  .typing { display: flex; gap: 5px; align-items: center; padding: 6px 0; }
  .typing span { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: typing-bounce 1.2s ease-in-out infinite; }
  .typing span:nth-child(2){animation-delay:0.2s;background:var(--accent2)}
  .typing span:nth-child(3){animation-delay:0.4s;background:var(--accent3)}
  @keyframes typing-bounce { 0%,100%{transform:translateY(0);opacity:0.4} 50%{transform:translateY(-6px);opacity:1} }
  .input-area { padding: 16px 24px 20px; border-top: 1px solid var(--border); background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); position: relative; z-index: 10; flex-shrink: 0; }
  .input-wrapper { display: flex; gap: 12px; align-items: flex-end; background: var(--surface2); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; transition: all 0.2s; }
  .input-wrapper:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,106,255,0.1); }
  textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'DM Mono', monospace; font-size: 13px; resize: none; max-height: 120px; min-height: 22px; line-height: 1.6; }
  textarea::placeholder { color: var(--text2); }
  .send-btn { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn svg { width: 16px; height: 16px; fill: white; }
  .input-hint { text-align: center; font-size: 10px; color: var(--text2); margin-top: 10px; opacity: 0.6; }
  .bubble strong { color: var(--accent3); }
  .bubble pre { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 10px 0; overflow-x: auto; font-size: 12px; }
  .bubble code { font-family: 'DM Mono', monospace; background: rgba(124,106,255,0.15); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .bubble pre code { background: transparent; padding: 0; }
  .notice { background: rgba(124,106,255,0.1); border: 1px solid rgba(124,106,255,0.3); border-radius: 10px; padding: 10px 14px; font-size: 11px; color: var(--text2); text-align: center; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <div class="logo-icon">🤖</div>
    <span class="logo-text">NexusAI</span>
  </div>
  <div class="status"><div class="status-dot"></div><span>Online</span></div>
  <button class="clear-btn" onclick="clearChat()">[ clear ]</button>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">✦</div>
    <h1>Hello, I'm NexusAI</h1>
    <p>Powered by Google Gemini AI. Ask me anything — I'm here to help!</p>
    <div class="suggestions">
      <div class="suggestion" onclick="sendSuggestion('What can you help me with?')">What can you help me with?</div>
      <div class="suggestion" onclick="sendSuggestion('Explain AI in simple terms')">Explain AI simply</div>
      <div class="suggestion" onclick="sendSuggestion('Write a short poem about technology')">Write a poem</div>
      <div class="suggestion" onclick="sendSuggestion('Give me 5 productivity tips')">Productivity tips</div>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="userInput" placeholder="Ask me anything..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
</div>

<script>
  const API_KEY = "AIzaSyDKbI-xS2UXY1CAIPo2_4NNvAAmwBoJb5o";
  const MODELS = [
    "gemini-1.5-flash",
    "gemini-1.5-pro",
    "gemini-pro"
  ];
  let currentModel = 0;
  let conversationHistory = [];
  let isLoading = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function sendSuggestion(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  function clearChat() {
    conversationHistory = [];
    currentModel = 0;
    document.getElementById('chatArea').innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h1>Hello, I'm NexusAI</h1>
        <p>Powered by Google Gemini AI. Ask me anything!</p>
        <div class="suggestions">
          <div class="suggestion" onclick="sendSuggestion('What can you help me with?')">What can you help me with?</div>
          <div class="suggestion" onclick="sendSuggestion('Explain AI in simple terms')">Explain AI simply</div>
          <div class="suggestion" onclick="sendSuggestion('Write a short poem about technology')">Write a poem</div>
          <div class="suggestion" onclick="sendSuggestion('Give me 5 productivity tips')">Productivity tips</div>
        </div>
      </div>`;
  }

  async function tryAPI(text) {
    for (let i = 0; i < MODELS.length; i++) {
      const model = MODELS[i];
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`;
      try {
        const body = {
          contents: [
            ...conversationHistory,
            { role: 'user', parts: [{ text }] }
          ],
          generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 1024
          }
        };
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (response.ok) {
          const data = await response.json();
          if (data.candidates && data.candidates[0]) {
            return { success: true, text: data.candidates[0].content.parts[0].text, model };
          }
        }
      } catch(e) {
        continue;
      }
    }
    return { success: false };
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text || isLoading) return;

    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    appendMessage('user', text);
    input.value = ''; input.style.height = 'auto';

    const typingId = showTyping();
    isLoading = true;

    const result = await tryAPI(text);
    removeTyping(typingId);

    if (result.success) {
      conversationHistory.push({ role: 'user', parts: [{ text }] });
      conversationHistory.push({ role: 'model', parts: [{ text: result.text }] });
      appendMessage('ai', result.text);
    } else {
      appendMessage('ai', '⚠️ Cannot connect to AI. Please make sure you have internet connection and try again.');
    }

    isLoading = false;
  }

  function appendMessage(role, text) {
    const chatArea = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <div class="avatar ${role}">${role === 'ai' ? '🤖' : '👤'}</div>
      <div class="bubble ${role}">
        <div class="bubble-label">${role === 'ai' ? 'NexusAI' : 'You'}</div>
        ${formatText(text)}
      </div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function formatText(text) {
    text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function showTyping() {
    const chatArea = document.getElementById('chatArea');
    const id = 'typing-' + Date.now();
    const div = document.createElement('div');
    div.className = 'message'; div.id = id;
    div.innerHTML = `<div class="avatar ai">🤖</div><div class="bubble ai"><div class="bubble-label">NEXUSAI</div><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }
</script>
</body>
</html>
